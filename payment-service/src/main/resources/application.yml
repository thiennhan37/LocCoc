server:
  port: ${PAYMENT_PORT:8085}

spring:
  application:
    name: payment-service
  datasource:
    url: ${PAYMENT_DB_URL:jdbc:mysql://127.0.0.1:3307/payment_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&useUnicode=true&characterEncoding=UTF-8}
    username: ${PAYMENT_DB_USER:payment_user}
    password: ${PAYMENT_DB_PASSWORD:payment_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

payos:
  client-id: ${PAYOS_CLIENT_ID:dummy-client-id}
  api-key: ${PAYOS_API_KEY:dummy-api-key}
  checksum-key: ${PAYOS_CHECKSUM_KEY:dummy-checksum-key}
  return-url: ${PAYOS_RETURN_URL:http://localhost:8080/payments/success}
  cancel-url: ${PAYOS_CANCEL_URL:http://localhost:8080/payments/cancel}
