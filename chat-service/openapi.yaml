openapi: 3.0.3
info:
  title: LocCoc Chat Service
  version: 0.1.0
  description: |
    Chat văn bản 1–1 dùng account/session thật và quan hệ FRIENDS từ User Service.
    Bearer token bắt buộc cả qua gateway lẫn service trực tiếp. Socket.IO trực tiếp
    origin port 8083, namespace /chat, path /socket.io; handshake auth.accessToken.
    Gửi tin qua REST, nhận event message:new; resync bằng history/detail khi reconnect.
servers:
  - url: http://localhost:8080
    description: Nest gateway
  - url: http://localhost:8083
    description: Chat Service trực tiếp
security:
  - bearerAuth: []
tags:
  - name: Conversations
  - name: Messages
  - name: Health
paths:
  /health:
    get:
      tags: [Health]
      operationId: chatHealth
      summary: Kiểm tra tiến trình Chat Service
      servers:
        - url: http://localhost:8083
      security: []
      responses:
        '200':
          description: Tiến trình đang chạy; không kiểm tra Auth/User hoặc readiness DB
          content:
            application/json:
              example: {status: ok}
              schema:
                type: object
                properties:
                  status: {type: string, enum: [ok]}
  /chat/conversations/direct:
    post:
      tags: [Conversations]
      operationId: openDirectChat
      summary: Mở hoặc lấy hội thoại với một bạn bè
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [peerId]
              properties:
                peerId: {type: string, format: uuid}
      responses:
        '200': {$ref: '#/components/responses/Conversation'}
        default: {$ref: '#/components/responses/Error'}
  /chat/conversations:
    get:
      tags: [Conversations]
      operationId: listChats
      summary: Danh sách hội thoại của tài khoản hiện tại
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 50, default: 20}}
        - {name: cursor, in: query, schema: {type: string, maxLength: 512}}
      responses:
        '200':
          description: Inbox theo thời gian cập nhật giảm dần
          content:
            application/json:
              schema:
                type: object
                required: [data, nextCursor]
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/Conversation'}}
                  nextCursor: {type: string, nullable: true}
        default: {$ref: '#/components/responses/Error'}
  /chat/conversations/{id}:
    parameters:
      - {$ref: '#/components/parameters/ConversationId'}
    get:
      tags: [Conversations]
      operationId: getChat
      summary: Lấy quyền tương tác và read cursors để resync
      responses:
        '200': {$ref: '#/components/responses/Conversation'}
        default: {$ref: '#/components/responses/Error'}
  /chat/conversations/{id}/messages:
    parameters:
      - {$ref: '#/components/parameters/ConversationId'}
    get:
      tags: [Messages]
      operationId: chatHistory
      summary: Lịch sử hoặc tin bị lỡ; thứ tự sequence tăng dần
      description: Không gửi đồng thời before và after. Tiếp tục after bằng sequence cuối cho tới hasMore=false.
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
        - {name: before, in: query, schema: {$ref: '#/components/schemas/Sequence'}}
        - {name: after, in: query, schema: {$ref: '#/components/schemas/Sequence'}}
      responses:
        '200':
          description: Trang tin; participant vẫn đọc được sau unfriend/block
          content:
            application/json:
              schema:
                type: object
                required: [data, hasMore]
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/Message'}}
                  hasMore: {type: boolean}
        default: {$ref: '#/components/responses/Error'}
    post:
      tags: [Messages]
      operationId: sendChatMessage
      summary: Gửi hoặc retry tin nhắn với cùng UUID và nội dung
      description: Tối đa 30 lần/phút/account. UUID trùng nhưng khác nội dung/conversation trả 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [clientMessageId, text]
              properties:
                clientMessageId: {type: string, format: uuid}
                text: {type: string, minLength: 1, maxLength: 2000, example: 'Xin chào 👋'}
      responses:
        '200':
          description: Tin đã commit hoặc đã tồn tại từ lần gửi trước
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: {$ref: '#/components/schemas/Message'}
        default: {$ref: '#/components/responses/Error'}
  /chat/conversations/{id}/read:
    parameters:
      - {$ref: '#/components/parameters/ConversationId'}
    patch:
      tags: [Messages]
      operationId: markChatRead
      summary: Đánh dấu đã đọc tới một message thực sự, cursor chỉ tăng
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [sequence]
              properties:
                sequence: {$ref: '#/components/schemas/Sequence'}
      responses:
        '200':
          description: Read cursor được lưu
          content:
            application/json:
              schema:
                type: object
                properties:
                  lastReadSequence: {$ref: '#/components/schemas/Sequence'}
                  unreadCount: {type: integer, minimum: 0}
        default: {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  parameters:
    ConversationId: {name: id, in: path, required: true, schema: {type: string, format: uuid}}
  responses:
    Error:
      description: '400 dữ liệu không hợp lệ; 401 token/phiên; 403 quan hệ/account không cho phép; 404 không phải participant; 409 UUID trùng nội dung khác; 429 quota; 503 dependency; 500 lỗi nội bộ.'
      content:
        application/json:
          schema:
            type: object
            properties:
              statusCode: {type: integer}
              error: {type: string}
              code: {type: string}
              message:
                oneOf:
                  - {type: string}
                  - {type: array, items: {type: string}}
              requestId: {type: string, format: uuid}
    Conversation:
      description: Hội thoại có thể tương tác hoặc lịch sử bị giới hạn
      content:
        application/json:
          schema:
            type: object
            required: [conversation]
            properties:
              conversation: {$ref: '#/components/schemas/Conversation'}
  schemas:
    Sequence: {type: string, pattern: '^(0|[1-9][0-9]{0,17})$', example: '1'}
    Peer:
      type: object
      nullable: true
      properties:
        id: {type: string, format: uuid}
        username: {type: string}
        displayName: {type: string, nullable: true}
        avatarUrl: {type: string, nullable: true}
    Message:
      type: object
      required: [id, conversationId, senderId, clientMessageId, sequence, text, createdAt]
      properties:
        id: {type: string, format: uuid}
        conversationId: {type: string, format: uuid}
        senderId: {type: string, format: uuid}
        clientMessageId: {type: string, format: uuid}
        sequence: {$ref: '#/components/schemas/Sequence'}
        text: {type: string}
        createdAt: {type: string, format: date-time}
    Conversation:
      type: object
      required: [id, peer, canInteract, lastMessage, unreadCount, lastReadSequence, peerLastReadSequence, updatedAt]
      properties:
        id: {type: string, format: uuid}
        peer: {$ref: '#/components/schemas/Peer'}
        canInteract: {type: boolean}
        lastMessage:
          type: object
          nullable: true
          required: [id, conversationId, senderId, clientMessageId, sequence, text, createdAt]
          properties:
            id: {type: string, format: uuid}
            conversationId: {type: string, format: uuid}
            senderId: {type: string, format: uuid}
            clientMessageId: {type: string, format: uuid}
            sequence: {$ref: '#/components/schemas/Sequence'}
            text: {type: string}
            createdAt: {type: string, format: date-time}
        unreadCount: {type: integer, minimum: 0}
        lastReadSequence: {$ref: '#/components/schemas/Sequence'}
        peerLastReadSequence: {$ref: '#/components/schemas/Sequence'}
        updatedAt: {type: string, format: date-time}
