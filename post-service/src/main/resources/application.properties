spring.application.name=post-service
post.media-dir=${POST_MEDIA_DIR:${user.home}/Downloads/LocCoc/posts}
post.user-service-url=${USER_SERVICE_URL:http://127.0.0.1:8081}
post.feed-own-priority-hours=${POST_FEED_OWN_PRIORITY_HOURS:24}
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties],optional:file:../.env.post-media.local[.properties],optional:file:.env.post-media.local[.properties]
server.port=${POST_PORT:8089}
spring.datasource.url=${POST_DB_URL:jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5433}/${POST_DB_NAME:posts}}
spring.datasource.username=${POST_DB_USER:postgres}
spring.datasource.password=${POST_DB_PASSWORD:${POSTGRES_ADMIN_PASSWORD:postgres}}
spring.jpa.hibernate.ddl-auto=${POST_DB_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.mvc.problemdetails.enabled=false
server.error.include-message=never
server.error.include-stacktrace=never


# S3-compatible private post media (SeaweedFS locally; AWS S3 by configuration).
post.s3.endpoint=${POST_S3_ENDPOINT:http://127.0.0.1:9000}
post.s3.region=${POST_S3_REGION:us-east-1}
post.s3.bucket=${POST_S3_BUCKET:loccoc-posts}
post.s3.path-style=${POST_S3_PATH_STYLE:true}
post.s3.access-key=${POST_S3_ACCESS_KEY:${MEDIA_S3_ACCESS_KEY:}}
post.s3.secret-key=${POST_S3_SECRET_KEY:${MEDIA_S3_SECRET_KEY:}}
post.legacy-read-enabled=${POST_LEGACY_READ_ENABLED:false}

# Private gallery and durable indexing share the Post database.
post.semantic-enabled=${SEMANTIC_SEARCH_ENABLED:false}
post.embedding-dim=${EMBEDDING_DIM:768}
post.ai-url=${POST_AI_SERVICE_URL:http://127.0.0.1:8087}
post.ai-token=${AI_SERVICE_TOKEN:}
post.ai-actor-secret=${AI_ACTOR_SECRET:}
post.worker-enabled=${POST_WORKER_ENABLED:true}
post.account-events-enabled=${POST_ACCOUNT_EVENTS_ENABLED:true}
post.kafka-brokers=${KAFKA_BROKERS:127.0.0.1:9092}
post.account-events-topic=${ACCOUNT_EVENTS_TOPIC:account.events}
post.account-consumer-group=${POST_ACCOUNT_CONSUMER_GROUP:post-service-accounts-v1}
spring.servlet.multipart.enabled=false
post.max-per-owner=${MOMENTS_MAX_PER_OWNER:1000}
post.uploads-per-hour=${MOMENTS_UPLOADS_PER_HOUR:30}
spring.task.scheduling.pool.size=3
