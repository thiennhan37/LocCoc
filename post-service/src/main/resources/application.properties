spring.application.name=post-service
post.media-dir=${POST_MEDIA_DIR:${user.home}/Downloads/LocCoc/posts}
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]
server.port=${POST_PORT:8087}
spring.datasource.url=${POST_DB_URL:jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5433}/${POST_DB_NAME:posts}}
spring.datasource.username=${POST_DB_USER:postgres}
spring.datasource.password=${POST_DB_PASSWORD:${POSTGRES_ADMIN_PASSWORD:postgres}}
spring.jpa.hibernate.ddl-auto=${POST_DB_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.mvc.problemdetails.enabled=false
server.error.include-message=never
server.error.include-stacktrace=never

