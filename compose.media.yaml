# Standalone media service; shares the project service/volume with compose.yaml.
services:
  media-store:
    image: chrislusf/seaweedfs:4.53@sha256:ccad23e18639c8b98cee17e7100b95830a06077b56d8e5b006d6dcf8ec5e94a0
    profiles: [media]
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - ': "$${AWS_ACCESS_KEY_ID:?Set MEDIA_S3_ACCESS_KEY}"; : "$${AWS_SECRET_ACCESS_KEY:?Set MEDIA_S3_SECRET_KEY}"; exec weed mini -dir=/data -s3.port=8333'
    environment:
      AWS_ACCESS_KEY_ID: ${MEDIA_S3_ACCESS_KEY:-}
      AWS_SECRET_ACCESS_KEY: ${MEDIA_S3_SECRET_KEY:-}
    ports:
      - "127.0.0.1:9000:8333"
    volumes:
      - media_data:/data

volumes:
  media_data:
