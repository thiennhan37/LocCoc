<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>LocCoc - Profile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-font-smoothing: antialiased;
}

body {
    width: 390px;
    height: 844px;
    overflow: hidden;
    background-color: #FAF8F5;
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
    color: #24211E;
    position: relative;
    user-select: none;
}

/* Status Bar */
.status-bar {
    height: 44px;
    padding: 14px 24px 0 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}
.status-bar .time {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: -0.3px;
    color: #1F2328;
}
.status-icons {
    display: flex;
    align-items: center;
    gap: 7px;
}
.battery-wrap {
    display: flex;
    align-items: center;
    gap: 1.5px;
}
.battery-body {
    width: 23px;
    height: 12px;
    border: 1.5px solid #1F2328;
    border-radius: 3.5px;
    padding: 1.5px;
}
.battery-fill {
    width: 100%;
    height: 100%;
    background-color: #1F2328;
    border-radius: 1.5px;
}
.battery-cap {
    width: 1.5px;
    height: 4.5px;
    background-color: #1F2328;
    border-radius: 0 1px 1px 0;
}

/* Main Content Container */
.main-content {
    padding: 0 20px;
}

/* Top Navigation Bar */
.top-nav-bar {
    height: 46px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 4px;
}
.nav-circle-btn {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: #FAF8F6;
    border: 1px solid #ECE7E1;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 1px 4px rgba(0,0,0,0.03);
}
.nav-title {
    font-size: 17.5px;
    font-weight: 700;
    color: #24211E;
    letter-spacing: -0.3px;
}

/* Profile Header Section */
.profile-header {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-top: 15px;
    text-align: center;
}
.avatar-container {
    position: relative;
    width: 90px;
    height: 90px;
}
.avatar-ring {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    border: 2.8px solid #FF6B5F;
    padding: 2.5px;
    background-color: #FFFFFF;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 3px 14px rgba(255, 107, 95, 0.16);
}
.profile-avatar-img {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
    display: block;
}
.avatar-cam-badge {
    position: absolute;
    bottom: 0;
    right: 0;
    width: 27px;
    height: 27px;
    border-radius: 50%;
    background-color: #FF6B5F;
    border: 2.2px solid #FFFFFF;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 6px rgba(0,0,0,0.12);
}
.profile-name {
    font-size: 23px;
    font-weight: 800;
    color: #24211E;
    letter-spacing: -0.4px;
    margin-top: 10px;
}
.profile-username {
    font-size: 13.5px;
    font-weight: 500;
    color: #8C8681;
    margin-top: 2px;
}
.profile-bio {
    font-size: 13px;
    font-weight: 400;
    color: #55504A;
    margin-top: 6px;
}

/* Stats Row */
.stats-card {
    margin-top: 18px;
    background: #FAF8F6;
    border-radius: 20px;
    border: 1px solid #EFEAE4;
    padding: 14px 0;
    display: flex;
    align-items: center;
    justify-content: space-around;
}
.stat-col {
    display: flex;
    flex-direction: column;
    align-items: center;
    flex: 1;
}
.stat-num {
    font-size: 21px;
    font-weight: 800;
    color: #24211E;
    letter-spacing: -0.3px;
    line-height: 1.1;
}
.stat-label {
    font-size: 11.5px;
    font-weight: 400;
    color: #8C8681;
    margin-top: 3px;
}
.stat-divider {
    width: 1px;
    height: 28px;
    background-color: #E6E1DB;
}

/* Edit Profile Button */
.edit-profile-btn {
    margin-top: 14px;
    height: 46px;
    background-color: #FFF0ED;
    border: 1px solid #FFDDD7;
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
}
.edit-profile-text {
    font-size: 14px;
    font-weight: 600;
    color: #FF6B5F;
}

/* Memory Gallery Section */
.gallery-section {
    margin-top: 20px;
}
.gallery-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
}
.gallery-title {
    font-size: 16.5px;
    font-weight: 700;
    color: #24211E;
    letter-spacing: -0.2px;
}
.gallery-more {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 12px;
    font-weight: 600;
    color: #FF6B5F;
}
.gallery-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-top: 10px;
}
.memory-card {
    position: relative;
    height: 134px;
    border-radius: 18px;
    overflow: hidden;
    background-color: #EFECE8;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
}
.memory-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}
.memory-gradient {
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(15, 18, 20, 0.78) 0%, rgba(15, 18, 20, 0.1) 45%, transparent 100%);
}
.memory-tag {
    position: absolute;
    bottom: 9px;
    left: 9px;
    font-size: 11px;
    font-weight: 600;
    color: #FFFFFF;
    text-shadow: 0 1px 3px rgba(0,0,0,0.4);
}

/* Settings / Privacy Card */
.settings-card {
    margin-top: 18px;
    background: #FAF8F6;
    border-radius: 20px;
    border: 1px solid #EFEAE4;
    padding: 0 16px;
}
.settings-row {
    height: 52px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}
.settings-left {
    display: flex;
    align-items: center;
    gap: 12px;
}
.settings-title {
    font-size: 14px;
    font-weight: 600;
    color: #24211E;
}
.settings-right {
    display: flex;
    align-items: center;
    gap: 4px;
}
.settings-count {
    font-size: 12.5px;
    font-weight: 400;
    color: #8C8681;
}
.settings-divider {
    height: 1px;
    background-color: #EFEAE4;
}

/* Bottom Navigation */
.bottom-nav {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 390px;
    height: 76px;
    background: #FFFFFF;
    border-top: 1px solid #EFEAE4;
    display: flex;
    justify-content: space-around;
    padding-top: 9px;
}
.nav-tab {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 75px;
}
.nav-label {
    font-size: 10px;
    font-weight: 600;
    margin-top: 4px;
}
.nav-active {
    color: #FF6B5F;
}
.nav-inactive {
    color: #9E9791;
}
.nav-inactive .nav-label {
    font-weight: 500;
}

/* Home Indicator */
.home-indicator-wrap {
    position: absolute;
    bottom: 6px;
    left: 0;
    width: 390px;
    display: flex;
    justify-content: center;
    pointer-events: none;
}
.home-indicator {
    width: 134px;
    height: 5px;
    background-color: #24211E;
    border-radius: 100px;
}
</style>
</head>
