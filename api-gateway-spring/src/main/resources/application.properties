spring.application.name=api-gateway-spring
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]
server.port=${GATEWAY_PORT:8080}
server.forward-headers-strategy=none
spring.data.redis.url=${REDIS_URL:redis://localhost:6379}
spring.data.redis.connect-timeout=2s
spring.data.redis.timeout=2s
gateway.routes.auth=${AUTH_SERVICE_URL:http://localhost:8000}
gateway.routes.users=${USER_SERVICE_URL:http://localhost:8081}
gateway.routes.admin=${ADMIN_SERVICE_URL:http://localhost:8086}
gateway.routes.payments=${PAYMENT_SERVICE_URL:http://localhost:8085}
gateway.routes.subscriptions=${PAYMENT_SERVICE_URL:http://localhost:8085}
gateway.rate-limit-ttl-ms=${RATE_LIMIT_TTL_MS:60000}
gateway.rate-limit-max=${RATE_LIMIT_MAX:100}
gateway.connect-timeout-ms=${GATEWAY_CONNECT_TIMEOUT_MS:3000}
gateway.request-timeout-ms=${GATEWAY_REQUEST_TIMEOUT_MS:10000}
gateway.max-body-bytes=${GATEWAY_MAX_BODY_BYTES:1048576}
gateway.cors-origins=${CORS_ORIGINS:http://localhost:3000}
