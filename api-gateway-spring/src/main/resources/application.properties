spring.application.name=api-gateway-spring
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]
server.port=${GATEWAY_PORT:8080}
server.forward-headers-strategy=none
spring.data.redis.url=${REDIS_URL:redis://localhost:6379}
spring.data.redis.connect-timeout=2s
spring.data.redis.timeout=2s
gateway.routes.auth=${AUTH_SERVICE_URL:http://127.0.0.1:8000}
gateway.routes.users=${USER_SERVICE_URL:http://127.0.0.1:8081}
gateway.routes.notifications=${NOTIFICATION_SERVICE_URL:http://127.0.0.1:8084}
gateway.routes.moments=${POST_SERVICE_URL:http://127.0.0.1:8089}
gateway.routes.posts=${POST_SERVICE_URL:http://127.0.0.1:8089}
gateway.routes.chat=${CHAT_SERVICE_URL:http://127.0.0.1:8083}
gateway.routes.ai=${AI_SERVICE_URL:http://127.0.0.1:8087}
gateway.routes.admin=${ADMIN_SERVICE_URL:http://127.0.0.1:8086}
gateway.routes.payments=${PAYMENT_SERVICE_URL:http://127.0.0.1:8085}
gateway.routes.subscriptions=${PAYMENT_SERVICE_URL:http://127.0.0.1:8085}
gateway.rate-limit-ttl-ms=${RATE_LIMIT_TTL_MS:60000}
gateway.rate-limit-max=${RATE_LIMIT_MAX:100}
gateway.ai-rate-limit-max=${AI_RATE_LIMIT_MAX:5}
gateway.ai-rate-limit-window-ms=${AI_RATE_LIMIT_WINDOW_MS:60000}
gateway.ai-service-token=${AI_SERVICE_TOKEN:}
gateway.account-access-enabled=${GATEWAY_ACCOUNT_ACCESS_ENABLED:true}
gateway.internal-service-token=${INTERNAL_SERVICE_TOKEN:}
gateway.connect-timeout-ms=${GATEWAY_CONNECT_TIMEOUT_MS:3000}
gateway.request-timeout-ms=${GATEWAY_REQUEST_TIMEOUT_MS:10000}
gateway.max-body-bytes=${GATEWAY_MAX_BODY_BYTES:8388608}
# Profile/moment/AI media routes use dedicated request limits and upstream deadlines.
spring.servlet.multipart.enabled=false
server.tomcat.max-swallow-size=11MB
server.tomcat.connection-timeout=30s
gateway.cors-origins=${CORS_ORIGINS:http://localhost:3000}
